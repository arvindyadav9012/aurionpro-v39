name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Gradle Project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AurionPro-V39-APK
          path: "**/build/outputs/apk/debug/*.apk"
