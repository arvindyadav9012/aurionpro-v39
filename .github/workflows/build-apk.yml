name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Find Gradle Project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AurionPro-V39-APK
          path: "**/build/outputs/apk/debug/*.apk"
